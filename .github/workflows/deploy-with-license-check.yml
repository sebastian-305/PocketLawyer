on:
  push:
    branches:
      - front-end

name: Deploy website on push

jobs:
  license-audit:
    name: License compliance check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 (Projekt)
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '8.0.x'

      - name: Setup .NET 7 (für Lizenztool)
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '7.0.x'


      - name: Restore
        run: |
          # Lösung/Projekt automatisch finden – falls ihr mehrere habt, könnt ihr das fix setzen
          SOLUTION=$(git ls-files '*.sln' | head -n 1 || true)
          PROJECT=$(git ls-files '*/*.csproj' | head -n 1 || true)
          echo "SOLUTION=$SOLUTION" >> $GITHUB_ENV
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          if [ -n "$SOLUTION" ]; then
            dotnet restore "$SOLUTION"
          elif [ -n "$PROJECT" ]; then
            dotnet restore "$PROJECT"
          else
            echo "Kein .sln oder .csproj gefunden." && exit 1
          fi


      # ---- Lizenzprüfung (Whitelist anpassen) ----
      - name: Install license scanner (global tool)
        run: |
            dotnet tool install --global dotnet-project-licenses --ignore-failed-sources
            ls -la "$HOME/.dotnet/tools" || true

      - name: Generate license report (JSON + Text)
        run: |
            TARGET="${SOLUTION:-$PROJECT}"
            TOOL="$HOME/.dotnet/tools/dotnet-project-licenses"

            mkdir -p license-report

            # JSON-Report schreiben (inkl. transitiver Abhängigkeiten)
            "$TOOL" \
            --input "$TARGET" \
            --include-transitive \
            --json \
            --outfile "license-report/licenses.json"

            # Zusätzlich eine Textübersicht (optional)
            "$TOOL" \
            --input "$TARGET" \
            --include-transitive \
            --output \
            --output-directory "license-report"

      - name: Enforce allowed licenses (fail on violation)
        run: |
            # Erlaubte Lizenzen (SPDX-IDs) – Policy hier pflegen:
            ALLOWED='["MIT","Apache-2.0","BSD-2-Clause","BSD-3-Clause","ISC","Unicode-3.0"]'

            # jq kann auf ubuntu-latest fehlen -> sicherheitshalber installieren
            if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
            fi

            # Finde alle Pakete, deren LicenseType NICHT in der Allowed-Liste ist
            jq --argjson allowed "$ALLOWED" '
            map(select(.LicenseType as $lt | ($allowed | index($lt)) | not))
            ' license-report/licenses.json > license-report/disallowed.json

            COUNT=$(jq 'length' license-report/disallowed.json)

            if [ "$COUNT" -gt 0 ]; then
            echo "❌ Nicht erlaubte Lizenzen gefunden ($COUNT):"
            jq -r '.[] | "\(.Id) \(.Version) – License: \(.LicenseType)"' license-report/disallowed.json
            exit 1
            else
            echo "✅ Alle Lizenzen sind erlaubt."
            fi

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: license-report
            path: license-report/


  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: license-audit   # Deploy nur bei bestandenem Lizenz-Check
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: www383.your-server.de
          protocol: ftps
          username: sebastpt_3
          password: ${{ secrets.FTP_PW_KK }}
          local-dir: ./wwwroot/
